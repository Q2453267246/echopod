<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>全屏播放器</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;color:#FFFFFF;font-family:Inter,'Noto Sans SC',system-ui,sans-serif;background:linear-gradient(180deg, {{bgTop}} 0%, {{bgBottom}} 72%);transition:background 300ms">
  <div style="padding:16px 20px 0;display:flex;flex-direction:column;align-items:stretch">
    <div style="display:flex;justify-content:space-between;align-items:center;margin:0 -12px">
      <a href="Main.dc.html" aria-label="收起播放器" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></a>
      <div style="text-align:center"><div style="font-size:11px;letter-spacing:1px;color:rgba(255,255,255,.72)">正在播放</div><div style="font-size:13px;font-weight:600">来自 播放队列</div></div>
      <button aria-label="更多" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5.5" r="1.6" fill="currentColor"></circle><circle cx="12" cy="12" r="1.6" fill="currentColor"></circle><circle cx="12" cy="18.5" r="1.6" fill="currentColor"></circle></svg></button>
    </div>

    <div style="width:288px;height:288px;border-radius:20px;background:{{coverBg}};position:relative;overflow:hidden;align-self:center;margin-top:20px;box-shadow:0 24px 48px rgba(0,0,0,.35)">
      <span style="position:absolute;right:-40px;top:-40px;width:144px;height:144px;border-radius:50%;background:{{coverAccent}}"></span>
      <span style="position:absolute;left:28px;bottom:20px;font-size:128px;font-weight:700;line-height:1;color:{{coverInk}}">{{char}}</span>
    </div>

    <div style="display:flex;align-items:flex-start;gap:12px;margin-top:28px">
      <div style="flex:1;min-width:0">
        <h1 style="margin:0;font-size:22px;font-weight:700;line-height:1.35">{{title}}</h1>
        <div style="font-size:14px;color:rgba(255,255,255,.75);margin-top:6px">{{show}}</div>
      </div>
      <button aria-label="收藏" style="width:48px;height:48px;border-radius:24px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7a4.3 4.3 0 0 1 7.5 2.8C19.5 15.4 12 20 12 20z"></path></svg></button>
    </div>

    <div style="margin-top:22px">
      <div style="height:20px;position:relative;display:flex;align-items:center" role="slider" aria-label="播放进度" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100" tabindex="0">
        <div style="position:absolute;left:0;right:0;height:4px;border-radius:2px;background:rgba(255,255,255,.24)"></div>
        <div style="position:absolute;left:0;width:62%;height:4px;border-radius:2px;background:#FFFFFF"></div>
        <div style="position:absolute;left:calc(62% - 8px);width:16px;height:16px;border-radius:50%;background:#FFFFFF;box-shadow:0 2px 6px rgba(0,0,0,.3)"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.75);font-variant-numeric:tabular-nums;margin-top:4px"><span>38:12</span><span>-22:53</span></div>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding:0 4px">
      <button aria-label="上一集" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.8)"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 6v12L8.5 12z" fill="currentColor"></path><rect x="6" y="6" width="2.2" height="12" rx="1" fill="currentColor"></rect></svg></button>
      <button aria-label="快退 15 秒" style="width:56px;height:56px;display:flex;align-items:center;justify-content:center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"></path><path d="M4 3.5v3.7h3.7"></path><text x="12.2" y="15.2" text-anchor="middle" font-size="6.8" font-weight="700" fill="currentColor" stroke="none" font-family="Inter">15</text></svg></button>
      <button aria-label="{{playLabel}}" onClick="{{togglePlay}}" style="width:76px;height:76px;border-radius:38px;background:#FFFFFF;color:{{bgBottom}};display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.25)">
        <sc-if value="{{playing}}" hint-placeholder-val="{{ true }}"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="3.6" height="14" rx="1.2" fill="currentColor"></rect><rect x="13.9" y="5" width="3.6" height="14" rx="1.2" fill="currentColor"></rect></svg></sc-if>
        <sc-if value="{{paused}}" hint-placeholder-val="{{ false }}"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.5v13l10.5-6.5z" fill="currentColor"></path></svg></sc-if>
      </button>
      <button aria-label="快进 30 秒" style="width:56px;height:56px;display:flex;align-items:center;justify-content:center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"></path><path d="M20 3.5v3.7h-3.7"></path><text x="11.8" y="15.2" text-anchor="middle" font-size="6.8" font-weight="700" fill="currentColor" stroke="none" font-family="Inter">30</text></svg></button>
      <button aria-label="下一集" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.8)"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6v12l8.5-6z" fill="currentColor"></path><rect x="15.8" y="6" width="2.2" height="12" rx="1" fill="currentColor"></rect></svg></button>
    </div>

    <div style="display:grid;grid-template-columns:repeat(5, minmax(0, 1fr));margin-top:18px">
      <button onClick="{{cycleSpeed}}" style="height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px"><span style="height:24px;font-size:15px;font-weight:700;display:flex;align-items:center">{{speedLabel}}</span><span style="font-size:11px;color:rgba(255,255,255,.75)">倍速</span></button>
      <button style="height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 14.5A8 8 0 1 1 9.5 4.5a6.5 6.5 0 0 0 10 10z"></path></svg><span style="font-size:11px;color:rgba(255,255,255,.75)">定时</span></button>
      <button style="height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"></path></svg><span style="font-size:11px;color:rgba(255,255,255,.75)">下载</span></button>
      <a href="Queue.dc.html" style="height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg><span style="font-size:11px;color:rgba(255,255,255,.75)">队列</span></a>
      <a href="EpisodeDetail.dc.html" style="height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"></path><path d="M9 12h6M9 16h4"></path></svg><span style="font-size:11px;color:rgba(255,255,255,.75)">简介</span></a>
    </div>
  </div>

  <a href="Queue.dc.html" style="position:absolute;left:12px;right:12px;bottom:14px;height:52px;border-radius:16px;background:rgba(255,255,255,.12);display:flex;align-items:center;gap:10px;padding:0 14px">
    <span style="font-size:12px;color:rgba(255,255,255,.75);flex-shrink:0">接下来</span>
    <span style="font-size:13px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">慢下来，是一种能力吗？</span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"cover":{"editor":"enum","options":["夜航电台","代码与咖啡","城市漫游者","微观宇宙"],"default":"夜航电台","section":"封面取色演示"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { playing: true, speedIdx: 1 };
  }
  renderVals() {
    const sets = {
      '夜航电台': { coverBg: '#2E3A59', coverAccent: '#C9783B', coverInk: '#F7F5F0', char: '夜', bgTop: '#46557F', bgBottom: '#141A29', title: '在深夜写代码的人，都在想些什么', show: '夜航电台 · 第 87 期' },
      '代码与咖啡': { coverBg: '#2E6B66', coverAccent: '#E8D9B8', coverInk: '#F7F5F0', char: '码', bgTop: '#3F8780', bgBottom: '#0F2A27', title: 'Compose 重组优化：我们踩过的五个坑', show: '代码与咖啡 · 第 142 期' },
      '城市漫游者': { coverBg: '#8C4A3C', coverAccent: '#E8B07A', coverInk: '#F7F5F0', char: '城', bgTop: '#A86453', bgBottom: '#2E1712', title: '东京下町散步指南：从谷中到根津', show: '城市漫游者 · 第 58 期' },
      '微观宇宙': { coverBg: '#5B5F97', coverAccent: '#B9BCE6', coverInk: '#F7F5F0', char: '微', bgTop: '#7276B0', bgBottom: '#1D1F3F', title: '细胞里的快递系统', show: '微观宇宙 · 第 33 期' }
    };
    const s = sets[this.props.cover] || sets['夜航电台'];
    const speeds = ['1.0x', '1.2x', '1.5x', '2.0x', '0.8x'];
    const st = this.state || { playing: true, speedIdx: 1 };
    return {
      ...s,
      playing: st.playing,
      paused: !st.playing,
      playLabel: st.playing ? '暂停' : '播放',
      speedLabel: speeds[st.speedIdx % speeds.length],
      togglePlay: () => this.setState({ playing: !st.playing }),
      cycleSpeed: () => this.setState({ speedIdx: (st.speedIdx + 1) % speeds.length })
    };
  }
}
</script>
</body>
</html>
