<x-dc>
<helmet>

<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#F7F5F0;color:#1C1B19;font-family:Inter,'Noto Sans SC',system-ui,sans-serif">
  <div style="padding:16px 16px 0;display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;align-items:center;margin:0 -12px">
      <a href="Profile.dc.html" aria-label="返回" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
      <h1 style="margin:0;font-size:20px;font-weight:700;flex:1">收听统计</h1>
    </div>

    <div role="tablist" style="display:flex;gap:4px;background:#EFECE5;border-radius:24px;padding:4px">
      <button role="tab" aria-selected="false" style="flex:1;height:40px;border-radius:20px;font-size:14px;font-weight:500;color:#6B675F">日</button>
      <button role="tab" aria-selected="true" style="flex:1;height:40px;border-radius:20px;font-size:14px;font-weight:600;background:#FFFFFF;box-shadow:0 1px 3px rgba(28,27,25,.08)">周</button>
      <button role="tab" aria-selected="false" style="flex:1;height:40px;border-radius:20px;font-size:14px;font-weight:500;color:#6B675F">月</button>
      <button role="tab" aria-selected="false" style="flex:1;height:40px;border-radius:20px;font-size:14px;font-weight:500;color:#6B675F">年</button>
    </div>

    <div style="background:#FFFFFF;border-radius:24px;padding:20px 20px 16px;display:flex;flex-direction:column;gap:18px">
      <div style="display:flex;justify-content:space-between;align-items:flex-end">
        <div>
          <div style="font-size:13px;color:#6B675F">11月18日 – 11月24日</div>
          <div style="margin-top:4px"><span style="font-size:40px;font-weight:700;letter-spacing:-1px">12.5</span><span style="font-size:15px;color:#6B675F;margin-left:4px">小时</span></div>
          <div style="font-size:13px;color:#2E6B66;font-weight:600;margin-top:2px">比上周多 2.1 小时</div>
        </div>
        <div style="text-align:right;display:flex;flex-direction:column;gap:6px;padding-bottom:2px">
          <div><span style="font-size:20px;font-weight:700">18</span><span style="font-size:12px;color:#6B675F;margin-left:3px">集</span></div>
          <div><span style="font-size:20px;font-weight:700">126</span><span style="font-size:12px;color:#6B675F;margin-left:3px">小时累计</span></div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7, minmax(0, 1fr));gap:10px;align-items:end;height:170px" role="img" aria-label="每日收听时长：周一 1.5，周二 2.0，周三 0.8，周四 3.0，周五 1.2，周六 2.5，周日 1.5 小时">
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span style="font-size:11px;color:#6B675F">1.5</span><span style="width:100%;height:68px;border-radius:6px;background:#D6E7E3"></span></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span style="font-size:11px;color:#6B675F">2.0</span><span style="width:100%;height:91px;border-radius:6px;background:#D6E7E3"></span></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span style="font-size:11px;color:#6B675F">0.8</span><span style="width:100%;height:36px;border-radius:6px;background:#D6E7E3"></span></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span style="font-size:11px;font-weight:700;color:#1C1B19">3.0</span><span style="width:100%;height:136px;border-radius:6px;background:#2E6B66"></span></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span style="font-size:11px;color:#6B675F">1.2</span><span style="width:100%;height:54px;border-radius:6px;background:#D6E7E3"></span></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span style="font-size:11px;color:#6B675F">2.5</span><span style="width:100%;height:113px;border-radius:6px;background:#D6E7E3"></span></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span style="font-size:11px;color:#6B675F">1.5</span><span style="width:100%;height:68px;border-radius:6px;background:#D6E7E3"></span></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7, minmax(0, 1fr));gap:10px;text-align:center;font-size:12px;color:#6B675F;margin-top:-10px">
        <span>一</span><span>二</span><span>三</span><span style="color:#1C1B19;font-weight:600">四</span><span>五</span><span>六</span><span>日</span>
      </div>
    </div>

    <div style="background:#FFFFFF;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px">
      <div style="font-size:14px;font-weight:600">本周最常听</div>
      <div style="display:flex;align-items:center;gap:10px"><span style="width:28px;height:28px;border-radius:6px;background:#2E6B66;flex-shrink:0"></span><span style="font-size:13px;width:78px;flex-shrink:0">代码与咖啡</span><span style="flex:1;height:6px;border-radius:3px;background:#EFECE5;overflow:hidden"><span style="display:block;width:100%;height:100%;background:#2E6B66"></span></span><span style="font-size:12px;color:#6B675F;width:40px;text-align:right">4.2 h</span></div>
      <div style="display:flex;align-items:center;gap:10px"><span style="width:28px;height:28px;border-radius:6px;background:#2E3A59;flex-shrink:0"></span><span style="font-size:13px;width:78px;flex-shrink:0">夜航电台</span><span style="flex:1;height:6px;border-radius:3px;background:#EFECE5;overflow:hidden"><span style="display:block;width:74%;height:100%;background:#2E6B66"></span></span><span style="font-size:12px;color:#6B675F;width:40px;text-align:right">3.1 h</span></div>
      <div style="display:flex;align-items:center;gap:10px"><span style="width:28px;height:28px;border-radius:6px;background:#8C4A3C;flex-shrink:0"></span><span style="font-size:13px;width:78px;flex-shrink:0">城市漫游者</span><span style="flex:1;height:6px;border-radius:3px;background:#EFECE5;overflow:hidden"><span style="display:block;width:57%;height:100%;background:#2E6B66"></span></span><span style="font-size:12px;color:#6B675F;width:40px;text-align:right">2.4 h</span></div>
    </div>

    <div style="font-size:12px;color:#6B675F;line-height:1.5;padding:0 4px">只统计实际收听时间（按倍速折算前的真实时长），拖动进度条跳过的部分不计入。</div>
  </div>
</div>
