<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设置</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#F7F5F0;color:#1C1B19;font-family:Inter,'Noto Sans SC',system-ui,sans-serif">
  <div style="padding:16px 16px 0;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;margin:0 -12px">
      <a href="Profile.dc.html" aria-label="返回" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
      <h1 style="margin:0;font-size:20px;font-weight:700;flex:1">设置</h1>
    </div>

    <section style="display:flex;flex-direction:column;gap:8px">
      <h2 style="margin:0 0 0 4px;font-size:13px;font-weight:600;color:#6B675F">外观</h2>
      <div style="background:#FFFFFF;border-radius:20px;padding:4px 0">
        <div style="padding:12px 16px 10px;display:flex;flex-direction:column;gap:10px">
          <span style="font-size:15px;font-weight:500">主题模式</span>
          <div role="radiogroup" aria-label="主题模式" style="display:flex;gap:4px;background:#EFECE5;border-radius:20px;padding:3px">
            <sc-for list="{{themes}}" as="t" hint-placeholder-count="3">
              <button role="radio" aria-checked="{{t.checked}}" onClick="{{t.pick}}" style="flex:1;height:36px;border-radius:17px;font-size:13px;font-weight:{{t.weight}};background:{{t.bg}};color:{{t.color}};box-shadow:{{t.shadow}};transition:background 200ms">{{t.label}}</button>
            </sc-for>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;height:50px;padding:0 16px">
          <span style="flex:1;font-size:15px;font-weight:500">动态封面取色</span>
          <button role="switch" aria-checked="true" aria-label="动态封面取色" style="width:52px;height:32px;border-radius:16px;background:#2E6B66;position:relative;flex-shrink:0"><span style="position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:12px;background:#FFFFFF"></span></button>
        </div>
      </div>
    </section>

    <section style="display:flex;flex-direction:column;gap:8px">
      <h2 style="margin:0 0 0 4px;font-size:13px;font-weight:600;color:#6B675F">播放</h2>
      <div style="background:#FFFFFF;border-radius:20px;padding:4px 0">
        <button style="width:100%;display:flex;align-items:center;gap:12px;height:50px;padding:0 12px 0 16px;text-align:left"><span style="flex:1;font-size:15px;font-weight:500">默认播放速度</span><span style="font-size:14px;color:#6B675F">1.0x</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#BDB9B0" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></button>
        <button style="width:100%;display:flex;align-items:center;gap:12px;height:50px;padding:0 12px 0 16px;text-align:left"><span style="flex:1;font-size:15px;font-weight:500">快进 / 快退</span><span style="font-size:14px;color:#6B675F">30 秒 / 15 秒</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#BDB9B0" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></button>
        <div style="display:flex;align-items:center;gap:12px;height:50px;padding:0 16px"><span style="flex:1;font-size:15px;font-weight:500">自动播放下一集</span><button role="switch" aria-checked="true" aria-label="自动播放下一集" style="width:52px;height:32px;border-radius:16px;background:#2E6B66;position:relative;flex-shrink:0"><span style="position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:12px;background:#FFFFFF"></span></button></div>
        <div style="display:flex;align-items:center;gap:12px;height:50px;padding:0 16px"><span style="flex:1;font-size:15px;font-weight:500">耳机拔出时暂停</span><button role="switch" aria-checked="true" aria-label="耳机拔出时暂停" style="width:52px;height:32px;border-radius:16px;background:#2E6B66;position:relative;flex-shrink:0"><span style="position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:12px;background:#FFFFFF"></span></button></div>
      </div>
    </section>

    <section style="display:flex;flex-direction:column;gap:8px">
      <h2 style="margin:0 0 0 4px;font-size:13px;font-weight:600;color:#6B675F">下载与订阅</h2>
      <div style="background:#FFFFFF;border-radius:20px;padding:4px 0">
        <div style="display:flex;align-items:center;gap:12px;height:50px;padding:0 16px"><span style="flex:1;font-size:15px;font-weight:500">仅 Wi-Fi 下载</span><button role="switch" aria-checked="true" aria-label="仅 Wi-Fi 下载" style="width:52px;height:32px;border-radius:16px;background:#2E6B66;position:relative;flex-shrink:0"><span style="position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:12px;background:#FFFFFF"></span></button></div>
        <button style="width:100%;display:flex;align-items:center;gap:12px;height:50px;padding:0 12px 0 16px;text-align:left"><span style="flex:1;font-size:15px;font-weight:500">自动刷新频率</span><span style="font-size:14px;color:#6B675F">每 6 小时</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#BDB9B0" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></button>
        <div style="display:flex;align-items:center;gap:12px;height:50px;padding:0 16px"><span style="flex:1;font-size:15px;font-weight:500">自动下载新节目</span><button role="switch" aria-checked="false" aria-label="自动下载新节目" style="width:52px;height:32px;border-radius:16px;background:#E3DFD6;border:2px solid #8A867D;box-sizing:border-box;position:relative;flex-shrink:0"><span style="position:absolute;left:5px;top:5px;width:18px;height:18px;border-radius:9px;background:#8A867D"></span></button></div>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { theme: 0 };
  }
  renderVals() {
    const cur = (this.state && this.state.theme) || 0;
    const themes = ['跟随系统', '浅色', '深色'].map((label, i) => {
      const on = i === cur;
      return {
        label,
        checked: on ? 'true' : 'false',
        weight: on ? 600 : 500,
        bg: on ? '#FFFFFF' : 'transparent',
        color: on ? '#1C1B19' : '#6B675F',
        shadow: on ? '0 1px 3px rgba(28,27,25,.10)' : 'none',
        pick: () => this.setState({ theme: i })
      };
    });
    return { themes };
  }
}
</script>
</body>
</html>
